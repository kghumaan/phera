# Nightly LIVE agent-eval scorecard — costs real Anthropic tokens (~$1–3/run),
# so it is a scheduled quality stage, NOT a per-deploy gate. The deterministic
# eval suites (tests/agent-evals/*.test.ts incl. scenario-coverage enforcement)
# already run on every push via ci.yml and are the deploy signal.
#
# Required repo secrets (Settings → Secrets → Actions) — MUST point at the
# phera-test Supabase project, NEVER production:
#   EVALS_SUPABASE_URL                phera-test project URL
#   EVALS_SUPABASE_ANON_KEY           phera-test anon key
#   EVALS_SUPABASE_SERVICE_ROLE_KEY   phera-test service-role key
#   ANTHROPIC_API_KEY                 real model tokens are spent
#   GEMINI_API_KEY                    rooms/import parsing paths
#   AGENT_LAB_TOKEN                   any strong random string
# Until these exist the job exits early with a notice (never a red X).
name: Agent Evals (nightly live)

on:
  schedule:
    - cron: '30 7 * * *' # 07:30 UTC daily
  workflow_dispatch: # run on demand before big agent releases

concurrency:
  group: agent-evals-nightly
  cancel-in-progress: false

jobs:
  live-scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.EVALS_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EVALS_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.EVALS_SUPABASE_SERVICE_ROLE_KEY }}
      # The live vitest suite (tests/agent-evals/live) reads TEST_-prefixed names.
      TEST_SUPABASE_URL: ${{ secrets.EVALS_SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.EVALS_SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AGENT_LAB_TOKEN: ${{ secrets.AGENT_LAB_TOKEN }}
      # Never actually sends: agent-lab-* weddings skip alert emails entirely.
      RESEND_FROM_EMAIL: evals-noreply@phera.io
    steps:
      - name: Gate on configured secrets
        id: gate
        run: |
          if [ -z "$AGENT_LAB_TOKEN" ] || [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Agent-eval secrets not configured — skipping the live scorecard. Add EVALS_SUPABASE_* (phera-test!), ANTHROPIC_API_KEY, GEMINI_API_KEY, AGENT_LAB_TOKEN as repo secrets to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.configured == 'true'

      - name: Build app
        if: steps.gate.outputs.configured == 'true'
        run: npm run build

      - name: Start app
        if: steps.gate.outputs.configured == 'true'
        run: |
          npx next start -p 3000 &
          node -e "
            const poll = async () => {
              for (let i = 0; i < 60; i++) {
                try {
                  const r = await fetch('http://localhost:3000/', { signal: AbortSignal.timeout(3000) });
                  if (r.status) return;
                } catch {}
                await new Promise((res) => setTimeout(res, 2000));
              }
              console.error('app never came up');
              process.exit(1);
            };
            poll();
          "

      - name: Live scenario scorecard (min pass rate 90%)
        if: steps.gate.outputs.configured == 'true'
        run: node scripts/agent-evals.mjs --min-pass=0.9

      - name: Live invariant suite
        if: steps.gate.outputs.configured == 'true'
        run: npx vitest run tests/agent-evals/live

      - name: Upload scorecard report
        if: always() && steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-evals-report
          path: agent-evals-report.json
          if-no-files-found: ignore
