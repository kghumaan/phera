name: Multiple Commit Protection

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for multiple commits
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            if (commits.length > 1) {
              const commitMessages = commits.map(commit => `- ${commit.commit.message}`).join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ Multiple commits detected in this PR. Please squash your commits into a single commit.\n\nCurrent commits:\n${commitMessages}`
              });
              core.setFailed('Multiple commits detected. Please squash your commits into a single commit.');
            } 