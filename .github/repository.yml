name: Phera
description: Indian Wedding Platform - A dual-experience wedding platform with admin dashboard and guest website
visibility: private
default_branch: main
owner: gourmet-tech

# Branch Protection Rules
branch_protection:
  main:
    required_status_checks:
      strict: true
      contexts:
        - "Multiple Commit Protection"
    enforce_admins: true
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
    restrictions: null

# Repository Settings
settings:
  has_issues: true
  has_wiki: false
  has_projects: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

# Team Access
teams:
  - name: developers
    permission: push
  - name: maintainers
    permission: admin

# Collaborators
collaborators:
  kghumaan: push

# Issue Templates
issue_templates:
  - name: Bug Report
    about: Create a report to help us improve
    title: "[Bug] "
    body:
      - type: markdown
        attributes:
          value: |
            Thanks for taking the time to fill out this bug report!
      - type: input
        id: bug-description
        attributes:
          label: Bug Description
          description: A clear and concise description of what the bug is
          placeholder: Tell us what's happening
        validations:
          required: true
      - type: input
        id: reproduction
        attributes:
          label: Steps to reproduce
          description: Steps to reproduce the behavior
          placeholder: |
            1. Go to '...'
            2. Click on '....'
            3. See error
        validations:
          required: true
      - type: input
        id: expected
        attributes:
          label: Expected behavior
          description: What you expected to happen
          placeholder: Tell us what should happen
        validations:
          required: true
      - type: input
        id: screenshots
        attributes:
          label: Screenshots
          description: Add screenshots to help explain your problem
          placeholder: Drag and drop screenshots here
      - type: dropdown
        id: device
        attributes:
          label: Device
          description: What device were you using?
          options:
            - Desktop
            - Mobile
            - Tablet
        validations:
          required: true

  - name: Feature Request
    about: Suggest an idea for this project
    title: "[Feature] "
    body:
      - type: markdown
        attributes:
          value: |
            Thanks for taking the time to suggest a new feature!
      - type: input
        id: problem
        attributes:
          label: Problem Statement
          description: What problem are you trying to solve?
          placeholder: Tell us what problem you're facing
        validations:
          required: true
      - type: input
        id: solution
        attributes:
          label: Proposed Solution
          description: What would you like to see implemented?
          placeholder: Tell us what you'd like to see
        validations:
          required: true
      - type: input
        id: alternatives
        attributes:
          label: Alternatives Considered
          description: What alternatives have you considered?
          placeholder: Tell us about any alternatives you've considered
      - type: dropdown
        id: priority
        attributes:
          label: Priority
          description: How important is this feature?
          options:
            - High
            - Medium
            - Low
        validations:
          required: true 